# ==============================================================
# palm_preproc - demonstration
# Test run on the LIDAR landcover (landcover.gpkg), which is rougher
# than the landuse-derived landcover.shp used elsewhere.
#   python run_preproc.py -c config/demonstration.yaml
# ==============================================================

project:
    name: demonstration
    root: /home/stern/palm/DATA
    overwrite: true            # regenerate ALL outputs, resume state ignored

input:
    raw_data:
        layers:
            landcover: landcover.gpkg  # LIDAR; landcover.shp is the default
    user_data:
        dir: ./demonstration/DATA_user
        domain: domain.shp
        layers: {}             # no user layers: clipped raw data only

domains:
    child:
        grid_size: 1.0
    parent:
        grid_size: 4.0
        buffer: 500.0

run:
    origin_time: "2023-08-23 19:00:00"
    length: '29 h'
    wrf_date: "2023-08-23"

cluster:                       # normally set once in defaults/default.yaml
    user: stern
    queue: qprod
    walltime: "48 h"
    node_cpus: 80

advanced:
    cpu_topology:
        optimize_child: true
