# ==============================================================
# Minimal project config.
# Everything not shown comes from defaults/default.yaml, applied
# automatically. See template.yaml for every available setting, and
# defaults/default.yaml for the current site-wide baseline (buffers,
# resampling, cluster, nz auto-calculation, boundary cleanup, ...).
# ==============================================================

project:
    name: example_minimal
    root: /path/to/palm/DATA

input:
    user_data:
        dir: ./example_minimal/DATA_user
        domain: null                     # or: domain: domain.shp
        domain_from: landcover           # used only when domain is null

run:
    origin_time: "2023-08-23 17:00:00"   # UTC
    length: '29 h'
    wrf_date: "2023-08-23"

# Everything else - CRS, raw_data layer names, domain grids and buffers,
# clip/merge behaviour, cluster settings, nz and the CPU topology -
# comes from defaults/default.yaml. Add a key from template.yaml here
# only if THIS project has to differ from that baseline.
