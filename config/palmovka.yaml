# ==============================================================
# palm_preproc configuration
# Template: copy to config/<project>.yaml and edit.
# Run:  python run_preproc.py -c config/<project>.yaml
# Relative paths resolve against project.root (default: this file's directory).
# ==============================================================

project:
  name: palmovka
  # Base directory for all relative paths below. Default (null) = the
  # directory of this YAML file; since project configs live in config/,
  # point root at the project directory instead:
  root: /path/to/palm/DATA
  output_dir: ./palmovka              # domain_*.shp + DATA_child/ + DATA_parent/ go here
                                      # (relative to project.root)
  state_file: null                    # null -> <output_dir>/palm_preproc_state.json
  overwrite: true                     # true: regenerate ALL outputs - resume state
                                      # ignored, templates and aux files replaced
                                      # (import_process.log included; use with care)

crs:
  aligned: "EPSG:32633"               # working CRS; ALL data outputs are in this CRS
  domain_output: null                 # optional different CRS for domain_*.shp only
                                      # (e.g. "EPSG:5514"); data layers always stay
                                      # in crs.aligned because they must match the
                                      # PALM grid

# The user's own (child-domain) data - same interface as raw_data below.
# A layer participates when its file exists; set a layer to false to ignore
# an existing file, or to a path to use a file elsewhere. Layers found here
# are merged over the clipped raw layer with user priority inside the
# domain.shp footprint. domain is REQUIRED.
user_data:
  dir: ./palmovka/DATA_user    # relative to project.root
  # Area of interest: either an explicit domain.shp, or - with domain: null -
  # derive it from the full extent of one of the layers below via
  # domain_from (e.g. landcover). An explicit domain always wins.
  domain: null                        # filename in dir, a path, or null
  domain_from: landcover                   # e.g. landcover (used only when domain is null)
  layers:
    buildings: buildings.tif
    landcover: landcover.shp
    roofs:     roofs.shp
    walls:     walls.shp
    trees:     trees.shp

# The whole-city source data - only ever read, never modified.
raw_data:
  dir: ./DATA_raw
  layers:
    dem:       dem.tif
    buildings: buildings.tif
    landcover: landcover.shp
    roofs:     roofs.shp
    walls:     walls.shp
    trees:     trees.shp
  # Auxiliary files placed into DATA_child and DATA_parent (never
  # overwritten on reruns unless project.overwrite): "copy" takes the file
  # from raw_data.dir, "create_empty" (alias "touch") creates an empty file.
  aux_files:
    surface_params.csv: copy
    import_process.log: create_empty

domains:
  child:
    grid_size: 1.0                    # metres per grid point
    buffer: 0.0                       # no buffer for the child domain
    min_power: 3                      # dims divisible by 2^3 = 8 (multigrid)
    optimize_topology: true           # topology-aware sizing for the child
    confirm_optimized: true           # ask before accepting an optimization-grown
                                      # child (interactive sessions only)
  parent:
    grid_size: 4.0
    buffer: 400.0                     # metres each side around the FINAL (possibly
                                      # optimized) CHILD rectangle
    min_power: 3
    optimize_topology: true           # topology-aware sizing (procesor_topology rules)
    topology_max_overhead: 0.10       # allow +10% per axis while searching
    topology_opt: true                # cells/core divisible by 4
  align_child_to_parent: true         # child origin + extent on the parent grid
                                      # (requires integer parent/child grid ratio)
  strict_nesting: true                # ABORT if the child is off the parent
                                      # lattice (sub-grid displacement of the
                                      # static driver); false = warn only

clip:
  snap_rasters_to_grid: true          # resample rasters onto the exact PALM grid
  buildings_mask_layer: roofs         # clip buildings.tif to the FINAL roofs.shp
                                      # of each domain (null disables)
  buildings_nodata: -9999.0           # nodata forced on the buildings raster
  resampling:
    dem: bilinear
    buildings: nearest
    default: nearest
  workers: 4

merge:
  mode: difference                    # "difference": cut raw geometry along the
                                      #   domain.shp boundary (no gaps/overlaps)
                                      # "predicate": whole features, original
                                      #   merge.py behaviour
  predicate: within                   # used only in mode: predicate
  priority_source: domain             # "domain": user wins over the whole
                                      #   domain.shp footprint (holes stay holes)
                                      # "user_coverage": raw data fills holes
                                      #   inside the user coverage (polygons only)
  mark_user_column: user              # provenance column on every merged layer:
                                      #   1 = user feature, 0 = raw (null disables)
  fix_geometry: true                  # buffer(0) on polygon layers after merge
  int_columns: [lid, type, code]      # cast to nullable Int64 where present
  reassign_id:                        # regenerate unique 1..N ids after merge
    landcover: lid
  workers: 4

templates:
  dir: null                           # null -> defaults/templates/
  nested: true                        # nested set (parent + N02) or single-domain
  single_domain: parent               # domain used when nested: false
  case: null                          # null -> project.name
  overwrite: false                    # keep existing generated files on rerun
  topology_select: true               # true: pick from Hynek Reznicek's valid
                                      #   topologies at the terminal (recommended
                                      #   one on Enter / non-interactive runs)
                                      # false: take the recommendation silently
  list_all_topologies: false          # only the best-packed option per whole
                                      #   node count (true = list all)
  values:                             # null values leave <> placeholders + warn
    origin_time: "2023-08-23 19:00:00"                 # UTC, e.g. "2023-08-23 17:00:00"
    length: 29                                         # simulation length [h]: end_time (p3d) and
                                                       # simulation lenght in hours
    nz_parent: null
    nz_child: null
    wrf_date: "2023-08-23"                    # WRF path date, e.g. "2023-08-23"
    npes_parent: null                         # TARGET core counts steering the topology
    npes_child: null                          #   recommendation (null -> most cores)
    node_cpus: 80                             # cpus per node (-T): enables the nodes
                                              #   column and the node limits below
    min_nodes: 6                              # hide topologies below this node count
    max_nodes: 16                             # hide topologies above this node count
    npex_parent: null                         # null -> topology chooser (topology_select)
    npey_parent: null
    npex_child: null
    npey_child: null

report:
  file: null                          # null -> <output_dir>/domains_report.txt
  parent_name: parent                 # domain labels in the &nesting_parameters
  child_name: child                   #   block (npes come from the chosen topology)

# stages: intentionally NOT set here - inherits the current order from
# defaults/default.yaml. Pinning it explicitly would silently freeze this
# project to today's stage order (and, e.g., skip the boundary-cleanup stage
# entirely) even after defaults/default.yaml is updated in the future.
