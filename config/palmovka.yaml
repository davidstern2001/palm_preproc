# ==============================================================
# palm_preproc - palmovka
#   python run_preproc.py -c config/palmovka.yaml
# ==============================================================

project:
    name: palmovka
    root: /path/to/palm/DATA
    overwrite: true

input:
    user_data:
        dir: ./palmovka/DATA_user
        domain: null
        domain_from: landcover
        layers:
            buildings: buildings.tif   # user heights replace the raw ones
                                       # inside the domain footprint

domains:
    child:
        grid_size: 1.0
    parent:
        grid_size: 4.0
        buffer: 400.0

run:
    origin_time: "2023-08-23 19:00:00"
    length: '29 h'
    wrf_date: "2023-08-23"

cluster:
    node_cpus: 80
    nodes: [6, 16]             # [min, max] offered by the topology chooser

advanced:
    cpu_topology:
        optimize_child: true   # let the topology grow the child domain too
