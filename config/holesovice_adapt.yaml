# ==============================================================
# palm_preproc - holesovice_adapt
#   python run_preproc.py -c config/holesovice_adapt.yaml
# ==============================================================

project:
    name: holesovice_adapt
    root: /path/to/palm/DATA

input:
    user_data:
        dir: ./holesovice_adapt/DATA_holesovice_adapt
        domain: domain.shp

domains:
    child:
        grid_size: 1.0
    parent:
        grid_size: 2.0
        buffer: 400.0

run:
    origin_time: null          # UTC, e.g. "2023-08-23 17:00:00";
    length: null               # null leaves a <placeholder> and warns
    wrf_date: null

# stages is intentionally not set: it inherits the current order from
# defaults/default.yaml. Pinning it here would silently freeze this
# project to today's stage list even after the defaults are updated.
