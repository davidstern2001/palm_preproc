# --------------------------------------------------------------
# Other scalar p3d values, by namelist parameter name [K, or the
# parameter's own unit - the number is substituted verbatim]. Each entry
# is a 12-value monthly table or a {min/ave/max: ...} mapping; the
# substituted value replaces only the number, keeping the line's
# formatting. Candidates in the current templates: pt_surface (285 K),
# spinup_pt_mean (299 K), and the urban-surface interior temperatures
# wall_inner_temperature / roof_inner_temperature /
# window_inner_temperature (300 K = 26.85 C - a summer figure; heated
# Czech interiors in winter sit near 20-22 C = 293-295 K, so winter runs
# overestimate building heat loss with the constant). Since values are
# substituted verbatim, spinup_pt_amplitude (a diurnal temperature
# DIFFERENCE in K) may also be listed here if desired. NOT seasonal,
# leave alone: roughness_concrete, root_fraction, constant_roughness.
# --------------------------------------------------------------
# spinup_pt_mean: monthly mean 2 m air temperature [K];
# spinup_pt_amplitude: half the mean daily range [K] (PALM drives the
# spin-up surface air temperature as mean +/- amplitude over the day).
# Same Open-Meteo / ERA5 source as soil_temperature. For a heatwave case
# `statistic: max` takes the warmest year's month.
p3d_parameters:
  spinup_pt_mean:
    min: [268.01, 270.17, 274.01, 279.41, 284.78, 288.56, 290.01, 290.60, 284.65, 280.29, 275.48, 267.97]
    ave: [273.33, 274.95, 278.05, 282.96, 287.77, 291.61, 293.38, 293.21, 288.59, 283.68, 278.28, 274.62]
    max: [278.00, 279.74, 281.19, 286.94, 290.87, 296.02, 296.96, 296.75, 292.17, 286.45, 280.98, 279.32]
  spinup_pt_amplitude:
    min: [2.19, 2.65, 3.33, 4.12, 3.64, 4.16, 3.75, 3.76, 3.11, 2.80, 2.29, 2.04]
    ave: [2.79, 3.58, 4.48, 5.25, 5.07, 4.94, 4.87, 4.95, 4.51, 3.90, 2.94, 2.55]
    max: [3.72, 4.78, 5.91, 6.82, 6.04, 6.29, 5.80, 5.93, 6.12, 5.12, 3.50, 3.40]
