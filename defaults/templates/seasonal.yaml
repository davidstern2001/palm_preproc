    - [290.24, 290.24, 290.24, 289.63, 289.63, 287.85, 287.85, 284.25]   # Jul
    - [291.47, 291.47, 291.47, 291.11, 291.11, 289.81, 289.81, 286.51]   # Aug
    - [285.31, 285.31, 285.31, 285.70, 285.70, 286.85, 286.85, 287.54]   # Sep
