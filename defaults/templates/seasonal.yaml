# ==============================================================
# defaults/templates/seasonal.yaml
# ==============================================================
# Month-dependent temperatures applied when instantiating the run
# configuration templates, keyed on the month of
# templates.values.origin_time. This file lives with the template skeletons
# and follows the same resolution: a project that points templates.dir
# elsewhere uses the seasonal.yaml found there instead. Keys under a
# `seasonal:` section in the (project or site) config deep-merge OVER this
# file, so e.g. a heatwave project can set `seasonal: {statistic: max}`
# without editing it.
#
# All temperatures are in KELVIN, exactly as they appear in the generated
# pgem / p3d files - the substituted value is the value written, with no
# conversion. Monthly tables are 12 values, Jan..Dec, or a
# {min/ave/max: [12 values]} mapping selected by `statistic`. Anything
# null / absent leaves the template's own value untouched.
# ==============================================================

enabled: true
statistic: ave                      # min | ave | max

# --------------------------------------------------------------
# pgem water_pars_temp, per water landcover type id [K] - the key name
# matches PALM-GeM's own water_pars_temp; here each type holds monthly
# tables instead of one constant.
# River (2) uses measured Vltava monthly statistics. The other types are
# PLACEHOLDERS: constant year-round at the values the template used to
# hardcode (so their behaviour is unchanged) - replace with measured
# monthly data when available.
# --------------------------------------------------------------
# Water type ids listed here still carry placeholder (constant year-round)
# tables; the templates stage logs a TODO warning whenever one is applied.
# After entering measured monthly data for a type, remove its id from this
# list to silence the warning.
placeholder_water_types: [1, 3, 4, 5]

water_pars_temp:
  1:                                # Shore, lakes (placeholder: template's 298.45 K year-round)
    ave: [298.45, 298.45, 298.45, 298.45, 298.45, 298.45, 298.45, 298.45, 298.45, 298.45, 298.45, 298.45]
  2:                                # River - Vltava (measured; 1 C = 274.15 K)
    min: [274.15, 275.15, 276.15, 278.15, 281.15, 287.15, 290.15, 288.15, 284.15, 281.15, 276.15, 275.15]
    ave: [279.15, 279.15, 280.15, 283.15, 286.15, 291.15, 293.15, 292.15, 291.15, 286.15, 281.15, 278.15]
    max: [282.15, 282.15, 284.15, 289.15, 294.15, 296.15, 297.15, 296.15, 292.15, 289.15, 289.15, 281.15]
  3:                                # Open sea (placeholder: template's 300 K year-round)
    ave: [300, 300, 300, 300, 300, 300, 300, 300, 300, 300, 300, 300]
  4:                                # Pond (placeholder: template's 298.45 K year-round)
    ave: [298.45, 298.45, 298.45, 298.45, 298.45, 298.45, 298.45, 298.45, 298.45, 298.45, 298.45, 298.45]
  5:                                # Fountain (placeholder: template's 299.55 K year-round)
    ave: [299.55, 299.55, 299.55, 299.55, 299.55, 299.55, 299.55, 299.55, 299.55, 299.55, 299.55, 299.55]

# --------------------------------------------------------------
# p3d &land_surface_parameters [K]. Accepted forms:
#   soil_temperature: 12 monthly scalars (uniform over the 8 layers),
#     a {min/ave/max: [12 scalars]} mapping, or 12 rows of 8 layer values
#     (the physically better option - the annual wave damps with depth,
#     deep layers sit near the annual mean; CHMI publishes soil
#     temperatures at 5/10/20/50/100 cm).
#   deep_soil_temperature: a single annual scalar, 12 monthly scalars,
#     or a {min/ave/max: ...} mapping.
# --------------------------------------------------------------
# Source: Prague climatology 1995-2024 from the Open-Meteo historical
# weather API (archive-api.open-meteo.com; ERA5 / ERA5-Land reanalysis),
# grid cell 50.088 N 14.476 E - central Prague: the Old Town, the
# Klementinum station and Palmovka all fall in it (the outskirts sit in
# neighbouring cells about 11 km away). Hourly values, averaged per
# calendar month and year; min / ave / max = the lowest / mean / highest
# of the 30 yearly monthly means. A reanalysis for generic land, not a
# measurement under the city.
# Data by Open-Meteo.com (CC BY 4.0), based on ERA5 from the Copernicus
# Climate Change Service. Generated with palm_preproc 1.6.0, 2026-11-12.
#
# soil_temperature: 12 rows of the 8 PALM layers (default centres 1, 2, 5,
# 10, 20, 40, 80 and 200 cm), each layer taking the Open-Meteo layer it
# lies in (0-7, 0-7, 0-7, 7-28, 7-28, 28-100, 28-100, 100-255 cm).
# deep_soil_temperature: below PALM's soil column (2.93 m), where
# Open-Meteo has no data: a damped annual heat wave fitted to the four
# layers (annual mean 10.71 C, surface amplitude 10.98 K, damping depth
# 2.10 m, rms misfit 0.83 K) evaluated at 2.93 m, plus each year's
# deviation of the 100-255 cm layer damped to that depth.
#
# A dynamic driver with init_soil_t (palm_meteo from WRF) sets the soil
# layers itself; deep_soil_temperature always comes from here.
