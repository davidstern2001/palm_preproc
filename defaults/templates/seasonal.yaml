# ==============================================================
# defaults/templates/seasonal.yaml
# ==============================================================
# Month-dependent temperatures applied when instantiating the run
# configuration templates, keyed on the month of
# templates.values.origin_time. This file lives with the template skeletons
# and follows the same resolution: a project that points templates.dir
# elsewhere uses the seasonal.yaml found there instead. Keys under a
# `seasonal:` section in the (project or site) config deep-merge OVER this
# file, so e.g. a heatwave project can set `seasonal: {statistic: max}`
# without editing it.
#
# All temperatures are in KELVIN, exactly as they appear in the generated
# pgem / p3d files - the substituted value is the value written, with no
# conversion. Monthly tables are 12 values, Jan..Dec, or a
# {min/ave/max: [12 values]} mapping selected by `statistic`. Anything
# null / absent leaves the template's own value untouched.
# ==============================================================

enabled: true
statistic: ave                      # min | ave | max

# --------------------------------------------------------------
# pgem water_pars_temp, per water landcover type id [K] - the key name
# matches PALM-GeM's own water_pars_temp; here each type holds monthly
# tables instead of one constant.
# River (2): measured Vltava monthly statistics.
# Lakes (1) and ponds (4): the lake mixed-layer temperature of the
#   ERA5-Land reanalysis (monthly means 1995-2024, grid cell 50.1 N
#   14.5 E, central Prague; the cells around it differ by under 1 K),
#   min / ave / max = lowest / mean / highest of the 30 years' monthly
#   means, not below freezing. It is a MODELLED generic lake several
#   metres deep, not a measured Prague pond: a shallow pond runs warmer
#   on summer afternoons. For comparison, its August mean (19.5 C) sits
#   next to the measured Vltava (19 C); in winter the model lake freezes
#   (about 1 C) where the river stays near 6 C.
#   Source: Munoz Sabater, J. (2019): ERA5-Land monthly averaged data
#   from 1950 to present, Copernicus Climate Change Service (C3S)
#   Climate Data Store, doi:10.24381/cds.68d2bb30. Contains modified
#   Copernicus Climate Change Service information 2026.
# Fountains (5): no data source; the pond table is reused as a proxy
#   (shallow recirculated water follows the same seasons).
# Open sea (3): no table - not present around Prague; the pgem template's
#   own value stays.
# --------------------------------------------------------------
# Water type ids listed here carry placeholder (constant year-round)
# tables; the templates stage logs a TODO warning whenever one is applied.
placeholder_water_types: []

water_pars_temp:
  1:                                # Shore, lakes - ERA5-Land lake mixed layer
