# --------------------------------------------------------------
# p3d soil moisture (volumetric fraction, dimensionless). Genuinely
# seasonal in reality (wettest in late winter / spring, driest in late
# summer) and it matters for the latent heat flux. Same forms as
# soil_temperature: 12 monthly scalars (uniform over the 8 layers), a
# {min/ave/max: ...} mapping, or 12 rows of 8 layer values.
# null = the template's constant 0.3 stays.
#
# Filled from the same Open-Meteo / ERA5 source as soil_temperature, same
# layer mapping [m3/m3]. ERA5's moisture belongs to its own soil texture;
