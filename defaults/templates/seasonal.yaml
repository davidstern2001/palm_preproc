# --------------------------------------------------------------
# Other scalar p3d values, by namelist parameter name [K, or the
# parameter's own unit - the number is substituted verbatim]. Each entry
# is a 12-value monthly table or a {min/ave/max: ...} mapping; the
# substituted value replaces only the number, keeping the line's
# formatting. Candidates in the current templates: pt_surface (285 K),
# spinup_pt_mean (299 K), and the urban-surface interior temperatures
# wall_inner_temperature / roof_inner_temperature /
# window_inner_temperature (300 K = 26.85 C - a summer figure; heated
# Czech interiors in winter sit near 20-22 C = 293-295 K, so winter runs
# overestimate building heat loss with the constant). Since values are
# substituted verbatim, spinup_pt_amplitude (a diurnal temperature
# DIFFERENCE in K) may also be listed here if desired. NOT seasonal,
# leave alone: roughness_concrete, root_fraction, constant_roughness.
# --------------------------------------------------------------
# spinup_pt_mean / spinup_pt_amplitude: PALM sets the spin-up air
# temperature to  mean + amplitude x cos(solar zenith angle),  so neither
# is the daily mean or half the daily range (palmovka's 299 K / 8 K gave
# a 300.2 K daily mean swinging +/- 5.0 K). The tables hold the pair that
# reproduces, at 50.09 N in mid-month, the monthly mean 2 m air
# temperature and half the mean daily range of the same Open-Meteo / ERA5
# source as soil_temperature:
#   amplitude = half range / (cos(lat) cos(declination))
#   mean      = daily mean - amplitude x sin(lat) sin(declination)
# The reanalysis has no urban heat island: central Prague runs about
# 1-2 K warmer, mostly at night. For a heatwave case `statistic: max`
# takes the warmest year's month; the actual day can be hotter still.
#
# wall_ / roof_ / window_inner_temperature: the indoor temperature at the
# inner side of the building envelope [K]. Not weather data - DERIVED from
# the monthly mean 2 m air temperature (same source) with two rules:
#   * heated season: the design setpoint, 21 C (EN 16798-1 / CSN 73 0540
#     give 20-21 C for dwellings and offices);
#   * otherwise the EN 16798-1 adaptive-comfort temperature of buildings
#     without mechanical cooling, 0.33 x outdoor mean + 18.8 C,
#   whichever is higher (the formula passes 21 C at 6.7 C outdoors).
# The setpoint and formula are quoted from memory of the standard - check
# them against its text. Air-conditioned buildings (about 25-26 C in
# summer) and unheated ones are not represented; PALM's indoor_model
# computes the interior itself and then ignores these values.
p3d_parameters:
  spinup_pt_mean:
    min: [269.03, 270.92, 274.21, 278.59, 283.30, 286.42, 288.24, 289.50, 284.51, 280.86, 276.43, 269.02]
    ave: [274.63, 275.96, 278.31, 281.92, 285.71, 289.07, 291.09, 291.76, 288.38, 284.47, 279.50, 275.93]
    max: [279.73, 281.09, 281.54, 285.59, 288.41, 292.78, 294.23, 295.01, 291.89, 287.48, 282.43, 281.07]
