# =====================================================================
# palm_preproc - template listing every configuration setting
# =====================================================================
#
# HOW TO READ THIS FILE
#   * Uncommented lines have no usable default and must be set.
#     #commented lines are optional and show the default.
#   * A key listed as `a | b` accepts exactly one of those values.
#   * Sections 1-6 are what a new project actually has to decide.
#     Everything in 7. ADVANCED has a working default.
#   * project.defaults is applied BEFORE this file, so a project config
#     only states what is project-specific. See config/example_minimal.yaml.
#   * In paths, {name} is replaced by project.name.
#   * Paths are relative to project.root.
#   * An unknown or misspelt setting stops the run with a suggestion.
#
# Copy to config/<project>.yaml and run:
#   python run_preproc.py -c config/<project>.yaml


# ---------------------------------------------------------------------
# 1. PROJECT
# ---------------------------------------------------------------------
project:
    name: 'palmovka'
    root: '/storage/data/palm'   # base for every path below
    #output_dir: '{name}'        # domain_*.shp + DATA_child/ + DATA_parent/
    #overwrite: false            # true: regenerate ALL outputs - resume
                                 # state ignored, templates and aux files
                                 # replaced (import_process.log included)
    #defaults: 'defaults/default.yaml'   # site-wide values applied first;
                                 # false = none. Edit that file to change
                                 # the baseline for every new project.
    #state_file: null            # null -> <output_dir>/palm_preproc_state.json
                                 # false -> no state file, no resume
                                 # or an explicit path (quote it)


# ---------------------------------------------------------------------
# 2. INPUT DATA
# ---------------------------------------------------------------------
# Two sources. raw_data is the whole-city baseline and is only ever read.
# user_data is your own detailed data for the area of interest; it is
# merged OVER the clipped raw data inside the domain footprint.
# A layer takes part when its file exists; set it to false to ignore an
# existing file, or to a path to use a file elsewhere.
input:
    crs: 'EPSG:32633'            # working CRS; ALL data outputs use it
    #domain_crs: null            # optional different CRS for domain_*.shp
                                 # only (e.g. 'EPSG:5514'); data layers
                                 # always stay in input.crs because they
                                 # must match the PALM grid

    raw_data:
        dir: 'DATA_raw'
        #layers:                 # defaults shown; list only what differs
            #dem:       'dem.tif'
            #buildings: 'buildings.tif'
            #landcover: 'landcover.shp'
            #roofs:     'roofs.shp'
            #walls:     'walls.shp'
            #trees:     'trees.shp'

    user_data:
        dir: '{name}/DATA_{name}'
        # Area of interest: an explicit domain.shp, or - with domain:
        # null - derived from the full extent of domain_from (e.g.
        # landcover). An explicit domain always wins.
        domain: 'domain.shp'     # filename in dir, a path, or null
        #domain_from: null       # e.g. landcover; used only if domain: null
        #layers:                 # same names and defaults as raw_data
            #landcover: 'landcover.shp'
            #roofs:     'roofs.shp'
            #walls:     'walls.shp'
            #trees:     'trees.shp'
            # buildings may also be user-supplied: inside the domain
            # footprint the user heights fully replace the raw ones (the
            # raw raster then fills only outside). dem always comes from
            # raw_data.
            #buildings: false

    # Files placed into DATA_child and DATA_parent, never overwritten on
    # reruns unless project.overwrite. copy: take from raw_data.dir.
    # create_empty: create an empty file.
    #aux_files:
        #surface_params.csv: copy
        #import_process.log: create_empty


# ---------------------------------------------------------------------
# 3. DOMAINS
# ---------------------------------------------------------------------
# The child covers the area of interest; the parent is the child plus a
# buffer, at a coarser grid.
domains:
    child:
        grid_size: 1.0           # metres per grid point
        # Number of grid levels, counted from the DOMAIN BASE: level 0 is
        # the lowest point of the domain, not sea level and not the local
        # terrain. The vertical extent is therefore nz x dz metres above
        # that base - the same reference palm_postproc's region.z_max
        # uses, so the two numbers are directly comparable.
        # null = advanced.nz_factor x the tallest building above the
        # base, rounded up to a multiple the multigrid solver accepts.
        #nz: null
    parent:
        grid_size: 2.0
        buffer: 400.0            # metres each side around the FINAL
                                 # (possibly optimized) CHILD rectangle
        #nz: null


# ---------------------------------------------------------------------
# 4. SIMULATION RUN
# ---------------------------------------------------------------------
# Fills the generated _p3d, palm_meteo and PALM-GeM files. A null here
# leaves a <placeholder> in the output and warns.
run:
    origin_time: '2023-08-23 17:00:00'   # UTC
    length: '29 h'               # hours as a number (29) or a unit string
                                 # ('29 h', '1 d'); fills end_time (p3d)
                                 # and length (pmeteo)
    #wrf_date: null              # WRF path date; null = date of origin_time


# ---------------------------------------------------------------------
# 5. CLUSTER
# ---------------------------------------------------------------------
# Per-user, not per-project: normally set once in project.defaults.
# Fills the palmrun submit script and the pgem / pmeteo placeholders.
cluster:
    user: 'stern'                # cluster username (pgem pg_user/pg_owner)
    #wrf_dir: null               # base dir of WRF output, e.g. '/home/me/wrf'
    #queue: null                 # palmrun -q, e.g. qprod
    #walltime: null              # palmrun -t: WALL-CLOCK limit ('48 h',
                                 # '2 d', or hours as a number) - not the
                                 # simulated period
    #node_cpus: null             # cpus per node (palmrun -T): enables the
                                 # nodes column and a recommendation that
                                 # wastes the fewest cores on the last node
    #nodes: [2, 16]              # [min, max] offered by the topology chooser
    #cores: [null, null]         # [parent, child] TARGET core counts
                                 # steering the recommendation
                                 # (null = most cores)
    #palmrun_id: null            # palmrun -r; null = the case name
    #palmrun_config: null        # palmrun -c, e.g. default.ifx
    #palmrun_activation: null    # palmrun -a, e.g. 'd3# restart'


# ---------------------------------------------------------------------
# 6. OUTPUTS
# ---------------------------------------------------------------------
templates:                       # _p3d, palm_meteo and PALM-GeM files
    #enabled: true
    #case: null                  # null -> project.name
    #nested: true                # nested set (parent + N02) or single domain
    #single_domain: parent       # parent | child; used when nested: false
    #submit: true                # also write submit_<case>.sh, whose
                                 # -X / -T match the chosen topology
    #cyclic: false               # true: cyclic-boundary p3d variants - no
                                 # offline nesting, flow driven by
                                 # geostrophic wind / pressure gradient,
                                 # disturbances instead of STG. A STARTING
                                 # SKELETON: review the flow driving and
                                 # y_shift before a production run.
                                 # pgem and pmeteo are unaffected.

report:                          # domain geometry and &nesting_parameters
    #file: null                  # null -> <output_dir>/domains_report.txt
    #parent_name: parent         # domain labels in the report
    #child_name: child

# Seasonal (month-dependent) water, soil and other scalar p3d values are
# NOT configured here: they live in defaults/templates/seasonal.yaml, next
# to the template skeletons they parameterize, and are selected by the
# month of run.origin_time. All tables are in KELVIN. To override per
# project, add a `seasonal:` section here; it deep-merges over that file:
#
# seasonal:
#     statistic: ave             # min | ave | max


# ---------------------------------------------------------------------
# 7. ADVANCED   leave out unless you know you need it
# ---------------------------------------------------------------------
#advanced:
    #stages: [domains, templates, report, clip, merge]   # run order
    #templates_dir: null         # null -> defaults/templates/; point here
                                 # at a project-specific folder to override
                                 # just this project

    # --- 7a. Grid -----------------------------------------------------
    #grid:
        #nz_factor: 3.0          # domains.<d>.nz = this x the height of
                                 # the tallest building above the domain
                                 # base, when nz is null
        #min_power: 3            # domain dims divisible by 2^3 = 8
                                 # (multigrid solver)
        #align_child_to_parent: true   # child origin + extent on the
                                 # parent grid (needs an integer ratio)
        #strict_nesting: true    # ABORT if the child is off the parent
                                 # lattice (sub-grid displacement of the
                                 # static driver); false = warn only

    # --- 7b. CPU topology ---------------------------------------------
    # How the domain is divided among MPI processes (npex x npey),
    # following Hynek Reznicek's rules for valid PALM topologies.
    #cpu_topology:
        #select: true            # true: pick at the terminal (the
                                 # recommendation on Enter / in
                                 # non-interactive runs)
                                 # false: take the recommendation silently
        #list_all: false         # false: only the best-packed option per
                                 # whole node count (least idle space on
                                 # the last node); true: list them all
                                 # (needs cluster.node_cpus)
        #optimize_child: false   # let the topology grow the child domain
        #optimize_parent: true   # ... and the parent
        #confirm_optimized: true # ask before accepting a child grown this
                                 # way (interactive sessions only)
        #max_overhead: 0.10      # allow +10% per axis while searching
        #cells_per_core_div4: true   # cells per core divisible by 4
        #npex_parent: null       # pin instead of choosing
        #npey_parent: null
        #npex_child: null
        #npey_child: null

    # --- 7c. Clipping -------------------------------------------------
    #clip:
        #snap_rasters_to_grid: true   # resample onto the exact PALM grid
        #buildings_mask_layer: roofs  # clip buildings.tif to each domain's
                                 # FINAL roofs.shp (null disables)
        #buildings_nodata: -9999.0
        #resampling:
            #dem: bilinear
            #buildings: nearest
            #default: nearest
        #workers: 4

    # --- 7d. Merging --------------------------------------------------
    #merge:
        #mode: difference        # difference | predicate.
                                 # difference: cut raw geometry along the
                                 #   user coverage - no gaps or overlaps,
                                 #   even for a rotated or undersized
                                 #   domain
                                 # predicate: whole features (legacy)
        #predicate: within       # used only in mode: predicate
        #priority_source: domain # used only in mode: predicate
        #mark_user_column: user  # provenance column on every merged layer:
                                 # 1 = user feature, 0 = raw (null disables)
        # How raw data is removed where the user has data, per layer:
        #   coverage  - cut raw along the user geometry, so raw fills true
        #               gaps between user features (wall-to-wall layers:
        #               landcover)
        #   footprint - drop ALL raw inside the user-domain footprint;
        #               inside the domain the layer is user-only
        #               (buildings, roofs, walls, trees - their gaps are
        #               streets and stay empty)
        # Unlisted layers default to footprint.
        #raw_fill:
            #landcover: coverage
        # Optional per-layer mask polygon: that layer's OWN keep-user
        # boundary, overriding the shared domain footprint for it alone.
        # Paths resolve against input.user_data.dir (bare filename) or
        # project.root (a path). There is no implicit mask_<layer>.shp
        # convention - a mask applies only when pointed at a real file.
        #masks: {}
            #trees: 'mask_trees.shp'
        #fix_geometry: true      # buffer(0) on polygon layers after merge
        #int_columns: [lid, type, code]   # cast to nullable Int64
        #reassign_id:            # regenerate unique 1..N ids after merge
            #landcover: lid
        #workers: 4
